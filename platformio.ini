; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit SSD1306@2.5.16
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.2
build_flags = -DPASCAL_ENABLE_RELAYS=0

; Owner-confirmed 3.3 V-compatible, active-HIGH relay inputs and independent
; heater thermostat/cutoff. Appliances disconnected for initial relay checks.
[env:esp32dev-relays]
extends = env:esp32dev
build_flags =
    -DPASCAL_ENABLE_RELAYS=1
    -DPASCAL_RELAY_ACTIVE_LOW=0
    -DPASCAL_HARDWARE_COMMISSIONED=1
