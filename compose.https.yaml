services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PASCAL_DOMAIN: ${PASCAL_DOMAIN:?Set PASCAL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pascal:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
